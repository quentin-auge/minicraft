<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniCraft</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
    body { background: #87ceeb; }

    #game { position: fixed; inset: 0; }

    /* Crosshair */
    #crosshair {
      position: fixed; left: 50%; top: 50%;
      width: 22px; height: 22px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }
    #crosshair::before, #crosshair::after {
      content: ""; position: absolute; background: rgba(255,255,255,0.9);
      box-shadow: 0 0 2px rgba(0,0,0,0.8);
    }
    #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
    #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }

    /* Hotbar */
    #hotbar {
      position: fixed; bottom: 14px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 4px; padding: 4px;
      background: rgba(0,0,0,0.45);
      border: 2px solid rgba(0,0,0,0.6);
      border-radius: 6px;
      display: none;
    }
    #hotbar .slot {
      width: 46px; height: 46px;
      border: 2px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.5);
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      cursor: pointer;
    }
    #hotbar .slot img { width: 34px; height: 34px; image-rendering: pixelated; pointer-events: none; }
    #hotbar .slot .key {
      position: absolute; left: 3px; bottom: 1px;
      font-size: 10px; color: rgba(255,255,255,0.6); font-weight: bold;
    }
    #hotbar .slot.selected { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.9); }

    /* HUD info */
    #info {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      color: #fff; font-size: 13px; text-shadow: 1px 1px 2px #000;
      background: rgba(0,0,0,0.35); padding: 6px 12px; border-radius: 6px;
      display: none;
      text-align: center; line-height: 1.5;
    }

    /* Dimension label */
    #dim {
      position: fixed; top: 10px; left: 10px;
      color: #fff; font-size: 13px; font-weight: 600; text-shadow: 1px 1px 2px #000;
      background: rgba(0,0,0,0.4); padding: 6px 12px; border-radius: 6px;
      display: none;
    }

    /* Boss bar */
    #boss {
      position: fixed; top: 44px; left: 50%; transform: translateX(-50%);
      width: 360px; max-width: 80vw; display: none;
    }
    #boss .label { color: #d9a6ff; font-size: 13px; font-weight: 700; text-shadow: 1px 1px 2px #000; text-align: center; margin-bottom: 3px; }
    #boss .track { height: 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.4); border-radius: 6px; overflow: hidden; }
    #boss .fill { height: 100%; width: 100%; background: linear-gradient(90deg, #9b30ff, #d9a6ff); transition: width .15s; }

    /* Toast */
    #toast {
      position: fixed; top: 22%; left: 50%; transform: translateX(-50%);
      color: #fff; font-size: 20px; font-weight: 700; text-shadow: 1px 1px 3px #000;
      background: rgba(0,0,0,0.5); padding: 12px 22px; border-radius: 10px;
      opacity: 0; transition: opacity .4s; pointer-events: none; text-align: center;
    }

    /* Overlay / start screen */
    #overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #4a90d9, #87ceeb);
      z-index: 10; cursor: pointer;
    }
    #overlay .panel {
      background: rgba(0,0,0,0.6); color: #fff;
      padding: 40px 56px; border-radius: 14px; text-align: center;
      border: 2px solid rgba(255,255,255,0.2);
    }
    #overlay h1 { font-size: 44px; margin-bottom: 6px; letter-spacing: 2px; }
    #overlay h1 span { color: #7bc043; }
    #overlay .controls { margin-top: 22px; font-size: 14px; color: #cfd8e0; line-height: 1.8; text-align: left; display: inline-block; }
    #overlay .controls b { color: #fff; }
    #overlay .menu { margin-top: 26px; display: flex; gap: 12px; justify-content: center; }
    #overlay .menu-btn {
      font: inherit; font-size: 17px; font-weight: 600; color: #fff;
      background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.35);
      padding: 12px 22px; border-radius: 8px; cursor: pointer;
      transition: background .15s, transform .15s;
    }
    #overlay .menu-btn:hover { background: rgba(255,255,255,0.22); transform: translateY(-2px); }
    #overlay .hint { margin-top: 14px; font-size: 12px; color: #aab8c4; }
    #autosave { opacity: 0.75; font-size: 11px; }

    /* Dialogs (name a world / load saves) */
    .dlg {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(0,0,0,0.55);
      display: flex; align-items: center; justify-content: center;
    }
    .dlg-box {
      background: #223; color: #fff; padding: 24px 28px; border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.25); min-width: 320px; max-width: 460px;
      text-align: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .dlg-box h2 { margin-bottom: 14px; font-size: 20px; }
    .dlg-input {
      width: 100%; padding: 8px 10px; font-size: 15px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.4); color: #fff;
      box-sizing: border-box;
    }
    .dlg-input:focus { outline: none; border-color: #fff; }
    .dlg-actions { margin-top: 16px; display: flex; gap: 10px; justify-content: center; }
    .dlg-actions button {
      font: inherit; font-size: 14px; font-weight: 600; color: #fff;
      padding: 8px 16px; border-radius: 6px; cursor: pointer;
      background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.35);
    }
    .dlg-ok { background: #3a8 !important; border-color: #4c9 !important; }
    .dlg-path { font-size: 11px; color: #89a; margin-bottom: 10px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    .dlg-list { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; text-align: left; }
    .dlg-list li {
      padding: 10px 12px; border-radius: 6px; margin-bottom: 6px;
      background: rgba(255,255,255,0.08); cursor: pointer;
    }
    .dlg-list li:hover { background: rgba(255,255,255,0.16); }
    .dlg-empty { color: #abb; font-size: 14px; padding: 8px 0; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="crosshair"></div>
  <div id="hotbar"></div>
  <div id="info"><div id="autosave"></div></div>
  <div id="dim"></div>
  <div id="boss"><div class="label">Ender Dragon</div><div class="track"><div class="fill"></div></div></div>
  <div id="toast"></div>

  <div id="overlay">
    <div class="panel">
      <h1>Mini<span>Craft</span></h1>
      <div class="controls">
        <div><b>Arrows</b> &nbsp; Move</div>
        <div><b>Space</b> &nbsp; Jump</div>
        <div><b>Shift</b> &nbsp; Sprint</div>
        <div><b>Mouse</b> &nbsp; Look around</div>
        <div><b>Left Click</b> &nbsp; Place block</div>
        <div><b>Right Click</b> &nbsp; Break block</div>
        <div><b>Wheel</b> &nbsp; Select block</div>
        <div><b>F</b> &nbsp; Free camera (arrows + Shift)</div>
        <div><b>Portal Frame</b> &nbsp; Build a square to reach The End</div>
      </div>
      <div class="menu">
        <button class="menu-btn" id="btnNew">New World</button>
        <button class="menu-btn" id="btnLoad">Load Save…</button>
      </div>
      </div>
    </div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
